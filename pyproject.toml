[project]
name = "guedenbearg"
version = "0.1.0"
description = "Free digitizations of Westphalian Low Saxon works."
authors = [
    {name = "Jan Raring",email = "janraring@yahoo.de"}
]
readme = "README.md"
requires-python = ">=3.12"
